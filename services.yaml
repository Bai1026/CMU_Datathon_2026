# Care Finder: what counts as evidence that a facility offers a service.
#
# NOT CLINICALLY REVIEWED. These lists were drafted without a clinician. Please correct them.
#
# How terms match (case never matters):
#   dialy            matches at the START of a word: dialysis, dialyzer, dialyser
#   =CT              matches a WHOLE word only: "CT scan" yes, "CTG" no
#   open heart       spaces and hyphens are interchangeable and optional:
#                    "open heart", "open-heart", "openheart"
# Every term is checked against one record entry at a time (one item of the
# procedure / capability / equipment lists, or one sentence of the description).
#
# Fields of a service:
#   label         name shown to the user
#   urgency       emergency | urgent | planned   (sets distance limits, see scoring.yaml)
#   direct        the entry says the facility provides this service
#   equipment     equipment or a dedicated unit specific to this service
#   related       suggests the service without stating it
#   exclude       if an entry contains one of these, ignore it for this service
#   specialties   pieces of specialty codes (e.g. "nephrology" matches pediatricNephrology)
#   supports      supporting capabilities that count as corroboration (defined below)
#   min_support   how many of those supports are enough when no equipment is listed
#   needs_247     true: without a statement of 24/7 emergency care the grade cannot be "strong"
#   equipment_is_direct  true for services that ARE a machine (MRI, CT): an equipment
#                 entry counts as stating the service
#   hospital_level       true: a clinic, dentist or pharmacy claiming it gets a note
#   small_staff_note     false: do not add the "only N doctors" note for this service
#   target_minutes       how soon care should be reached, if there is a recognised benchmark.
#                        The answer compares the estimated travel time with it. Leave it out
#                        when no benchmark applies. EVERY VALUE BELOW IS A DRAFT that a
#                        clinician must confirm; target_note says where the number comes from.
#
# Grades:
#   strong    a direct entry, plus a SEPARATE entry with equipment, or enough supports
#   moderate  a direct entry only
#   weak      no direct entry; only equipment, a specialty tag or a related entry

# An entry containing one of these words is not counted as evidence
# ("No MRI on site", "patients are referred to ...").
negation: [=no, =not, =without, =lack, =lacks, =unavailable, =doesnt, "=doesn't", =refer, =refers,
           =referred, =referral, =nearest, =nearby, =outsourced]

# Supporting capabilities.
#   any_of   at least one term present
#   all_of   every listed group has at least one term present
#   none_of  no term present
#   specialty_any  also satisfied by a specialty code containing one of these
supports:
  24/7 emergency care:
    all_of:
      - ["24/7", "24x7", "24 x 7", "24*7", "24 hour", "24 hr", "=24h", "round the clock"]
      - [emergenc, casualty, trauma]
  operating theatre:
    any_of: [operation theat, operating theat, operation room, operating room, =OT]
  blood bank:
    any_of: [blood bank, blood storage]
  anaesthesia:
    any_of: [anesthe, anaesthe]
    specialty_any: [anesthe, anaesthe]
  adult ICU:
    any_of: [=ICU, intensive care, critical care]
    none_of: [neonat, =NICU, newborn, pediatric, paediatric]
  CT scanner:
    any_of: [=CT, computed tomography]
  ambulance:
    any_of: [ambulance]

services:
  dialysis:
    label: Dialysis
    urgency: urgent
    small_staff_note: false
    direct: [dialysis, hemodialysis, haemodialysis, =CRRT, renal replacement therapy]
    equipment:
      - dialysis machine
      - hemodialysis machine
      - haemodialysis machine
      - dialysis unit
      - hemodialysis unit
      - haemodialysis unit
      - dialysis chair
      - dialysis station
      - dialysis bed
      - dialysis equipment
      - dialysis facilit
      - dialysis center
      - dialysis centre
      - dialysis ward
      - dialysis room
      - dialysis suite
      - dialyzer
      - dialyser
      - =RO plant
      - =RO water plant
    related: []
    specialties: [nephrology]
    supports: []

  emergency_c_section:
    label: Emergency C-section
    urgency: emergency
    hospital_level: true
    needs_247: true
    target_minutes: 120
    target_note: "DRAFT. Two-hour access to a facility able to do a caesarean, the access benchmark used by the Lancet Commission on Global Surgery."
    direct: [c-section, cesarean, caesarean, =LSCS, emergency obstetric, obstetric emergenc, =CEmONC]
    equipment: [labour room, labor room, labour table, labor table, labour ward, labor ward,
                fetal monitor, =CTG, cardiotocograph, anesthesia machine, anaesthesia machine,
                anesthesia workstation, anaesthesia workstation]
    related: [deliver, maternity, obstetric, high risk pregnanc]
    specialties: [gynecologyandobstetrics, obstetric, maternalfetal]
    supports: [24/7 emergency care, operating theatre, blood bank, anaesthesia]
    min_support: 2

  nicu:
    label: NICU (newborn intensive care)
    urgency: emergency
    hospital_level: true
    direct: [=NICU, neonatal intensive, neonatal icu, neonatal critical, newborn intensive,
             newborn icu, =SNCU, special newborn care]
    equipment: [radiant warmer, infant warmer, incubator, phototherapy, bubble cpap,
                neonatal ventilator, neonatal cpap, neonatal monitor, neonatal multi,
                neonatal syringe, neonatal pulse, neonatal central]
    related: [neonat, newborn]
    specialties: [neonatology]
    supports: []

  cardiac_surgery:
    label: Cardiac surgery
    urgency: planned
    hospital_level: true
    direct: [=CABG, bypass surgery, bypass graft, open heart, cardiac surger, heart surger,
             cardiothoracic, cardio thoracic, =CTVS, valve replacement, valve repair]
    # Generic supports (ICU, theatre, blood bank) are deliberately not listed: nearly every
    # hospital has them, so they say nothing about cardiac surgery in particular.
    equipment: [heart lung machine, cardiopulmonary bypass, =IABP, =ECMO, cath lab,
                cardiac icu, =cardiac OT, cardiac operation theat, cardiac operating theat,
                =CTVS ICU, =CTVS OT, =CICU]
    related: [angioplast, angiograph, cardiolog]
    exclude: [gastric bypass, bariatric]
    specialties: [cardiacsurg, cardiothoracic, cardiovascularsurg, thoracic]
    supports: []

  mri:
    label: MRI scan
    urgency: planned
    small_staff_note: false
    equipment_is_direct: true
    direct: [=MRI, magnetic resonance]
    equipment: [tesla, MRI scanner, MRI machine, MRI unit, MRI system]
    related: []
    specialties: [radiology]
    supports: []

  ct_scan:
    label: CT scan
    urgency: urgent
    small_staff_note: false
    equipment_is_direct: true
    direct: [=CT, computed tomography]
    equipment: [CT scanner, CT machine, CT unit, CT system, slice CT]
    related: []
    specialties: [radiology]
    supports: []

  burn_care:
    label: Burn care
    urgency: emergency
    hospital_level: true
    direct: [burn unit, burns unit, burn ward, burns ward, burn care, burns care, burn center,
             burn centre, burns center, burns centre, burn icu, burns icu, burn treatment,
             burns treatment, burn management, burns management, burn surgery, burns surgery,
             burn injur, burns injur, treatment of burns, =burns]
    # As with cardiac surgery, generic supports are not counted as corroboration.
    equipment: [skin graft, dermatome, hydrotherapy, burn unit, burns unit, burn ward, burns ward,
                burn icu, burns icu, burn center, burn centre, burns center, burns centre,
                burn bed, burns bed]
    related: [plastic surg, reconstructive]
    specialties: [plasticsurgery, burn]
    supports: []

  trauma:
    label: Trauma care
    urgency: emergency
    hospital_level: true
    needs_247: true
    target_minutes: 60
    target_note: "DRAFT. The 'golden hour' often quoted for major trauma. It is a rule of thumb, not a firm clinical threshold."
    direct: [trauma center, trauma centre, trauma care, trauma surgery, trauma unit, trauma service,
             trauma team, polytrauma, accident and emergency, accident & emergency,
             road traffic accident]
    equipment: [fracture table, c-arm, defibrillator]
    related: [fracture, orthopedic, orthopaedic]
    specialties: [emergencymedicine, orthopedicsurgery, neurosurgery, trauma]
    supports: [24/7 emergency care, operating theatre, adult ICU, blood bank, CT scanner, ambulance]
    min_support: 3
