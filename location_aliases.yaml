# Care Finder: other names people use for places in India.
#
# FIRST DRAFT, written from general knowledge without access to the dataset. It can
# contain mistakes and it is not complete. The names in Indian scripts have not been
# checked by native speakers. The notebook prints which groups matched nothing in the
# data and suggests more pairs found in the data itself.
#
# How a place is looked up:
#   1. The text exactly as typed (after dropping the filler_words below).
#   2. other_scripts: a name written in another script stands for the English name.
#   3. places: every name in a group means the same place. The names are tried
#      in order and the first one found in the data is used.
#   4. If none of a group's names is in the data, its `within` district is used.
#   5. The closest spelling among known districts and cities (typing mistakes).
#   6. For a name in an Indian script that is not listed here: it is read letter by
#      letter ("गया" -> "gaya") and matched to a place that sounds the same. The answer
#      then says that this was an automatic reading.
#
# Accents and case never matter (Puné = pune). Digits may be in any script (८००००१ = 800001).
#
# Group fields:
#   names    all the spellings, old names and abbreviations for one place
#   within   the district that contains it (optional, used as a fallback)
#   state    only look in this state (optional, for names that exist in two states)

# Words that are not part of a place name and are ignored around it.
filler_words:
  # English
  - [near, nearby, in, at, around, from, within, outside, close, to, the, of]
  - [city, town, district, dist, area, region, taluk, tehsil, village, rural, urban]
  # Hindi and Urdu typed in Latin letters
  - [ke, paas, pas, mein, nazdeek, nazdik, zila, jila, shahar, sheher]
  # Hindi, Marathi
  - [के, पास, में, निकट, नजदीक, नज़दीक, जिला, ज़िला, शहर, गांव, गाँव, क्षेत्र, जवळ, जिल्हा, मध्ये]
  # Bengali, Gujarati, Punjabi, Odia
  - [কাছে, কাছাকাছি, জেলা, শহর]
  - [નજીક, પાસે, જિલ્લો, શહેર]
  - [ਨੇੜੇ, ਜ਼ਿਲ੍ਹਾ, ਸ਼ਹਿਰ]
  - [ନିକଟ, ଜିଲ୍ଲା, ସହର]
  # Tamil, Telugu, Kannada, Malayalam ("near", "district")
  - [அருகில், மாவட்டம்]
  - [దగ్గర, సమీపంలో, జిల్లా]
  - [ಹತ್ತಿರ, ಜಿಲ್ಲೆ]
  - [അടുത്ത്, ജില്ല]
  # Urdu
  - [قریب, ضلع, شہر, میں, کے, پاس]

