# Care Finder: every number the method depends on.
# These are judgment calls, not calibrated values. Change them here, not in the code.

# lat_min, lat_max, lon_min, lon_max. A loose box around India including the islands.
india_bbox: [6.0, 37.5, 68.0, 97.5]

# --- Is a facility's location believable? ---------------------------------------
# Coordinates further than this from the centre of the record's PIN code are suspect.
coord_pin_max_km: 50.0
# A PIN region is all PIN codes sharing their first 3 digits. Coordinates inside the
# region's radius are accepted even when far from the single PIN's centre.
# radius = region_median_factor x (median distance of the region's post offices from
# its centre), kept between region_min_km and region_max_km, plus region_margin_km.
# The median ignores a minority of wrong directory coordinates, and it grows on its
# own in sparse regions (Ladakh, Arunachal, western Rajasthan), so remote areas are
# not penalised by a fixed cap.
region_median_factor: 3.0
region_min_km: 50.0
region_max_km: 400.0
region_margin_km: 25.0

# --- Trust -----------------------------------------------------------------------
# A record whose phone-number count is in the top share of all records (and at least
# merged_min_phones) may combine several facilities.
merged_phone_quantile: 0.95
merged_min_phones: 5
# Trust starts at 1.0. Each problem found subtracts its penalty, down to trust_floor.
penalties:
  location_conflict: 0.15
  coords_outside_india: 0.10
  possible_merged_record: 0.20
  malformed_record: 0.20
  no_first_party_source: 0.10
trust_floor: 0.30

# --- Score = evidence x trust x proximity ----------------------------------------
# Evidence grade -> value.
tier_value:
  strong: 1.0      # states the service, and a separate entry backs it up
  moderate: 0.6    # states the service, nothing backs it up
  weak: 0.25       # never states it; only a specialty tag or related entry
# proximity = 1 / (1 + (km / half_km)^2). half_km is where proximity falls to 0.5.
half_km:
  emergency: 25.0
  urgent: 60.0
  planned: 150.0
# First search radius. If no record inside it states the service, the radius is
# multiplied by each of widen_factors in turn, and the answer says so.
max_km:
  emergency: 100.0
  urgent: 200.0
  planned: 500.0
widen_factors: [2.0, 4.0]
# How many options to show.
top_k: 3

# --- Sparse areas ------------------------------------------------------------------
# If fewer than this many located facilities of any kind are listed within
# sparse_radius_km of the user's location, the answer warns that coverage is thin.
sparse_radius_km: 50.0
sparse_max_facilities: 25

# --- Place names -------------------------------------------------------------------
# Minimum similarity (0 to 1) for a misspelled place name to be matched to a known one.
fuzzy_cutoff: 0.86
# A place name typed in an Indian script that is not listed in location_aliases.yaml is
# read letter by letter ("सीतामढ़ी" -> "sitamrhi") and compared with the names that have the
# same consonants. Minimum similarity (0 to 1) between the reading and the name. On a hand
# check of 93 right pairs and 11 wrong ones, 0.85 kept 90% of the right ones and none of
# the wrong ones (Jamui/Jammu and Patan/Patna score 0.80).
sound_match_min: 0.85

# --- Rough travel time ---------------------------------------------------------------
# There is no road network in this project, so travel time is a RANGE estimated from
# the straight-line distance:
#   road distance = straight-line km x circuity   (roads are never straight)
#   fastest = km x circuity_min / speed_fast_kmh
#   slowest = km x circuity_max / speed_slow_kmh
# These four numbers are assumptions, not measurements. Shown on the answer as an
# estimate; they do not change the ranking.
travel:
  circuity_min: 1.2
  circuity_max: 1.5
  speed_fast_kmh: 50.0
  speed_slow_kmh: 25.0
